<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" id="theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.add('light');
          document.getElementById('theme-color').setAttribute('content', '#f0f0f0');
        }
      })();
    </script>
    <meta name="description" content="Золотая Ложка — премиальное приложение ресторана" />
    <link rel="icon" type="image/x-icon" href="https://upload.timka20.ru/files/7bc87caadc65.ico" />
    <link rel="apple-touch-icon" href="https://upload.timka20.ru/files/7bc87caadc65.ico" />
    <link rel="manifest" href="/manifest.json" />
    <title>Золотая Ложка</title>
  </head>
  <body class="bg-charcoal text-snow">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
